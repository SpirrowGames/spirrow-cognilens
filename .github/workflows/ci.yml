name: CI

on:
  push:
    branches: [main]
  # branches を指定しない = **どのブランチ宛の PR でも走る**。
  #
  # 以前は `branches: [main]` だった ∴ develop 宛の PR では CI が一度も
  # 回らないまま develop に溜まり、main への統合 PR で初めてまとめて走る
  # ——— そこで落ちると、どの PR が原因かの切り分けが最後にまとめて来る。
  # 個別の PR を緑にしてから積める形に戻す。
  #
  # 先例は spirrow-voxelworld (V-4: feature -> develop -> release -> main)。
  # あちらの main-base-guard.yml が `branches: [main]` なのは意図的で、
  # **main 宛の PR を検査する門**だから ——— あれを全ブランチにすると門が壊れる。
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Tests first, and every step runs even if an earlier one failed.
      # Previously lint came first and stopped the job, so a lint error
      # meant the test step never executed -- main was red from
      # 2026-04-13 and nobody could see that the suite itself was fine.
      # A red build should say which things are broken, not just the
      # first one.
      - name: Run tests
        run: |
          pytest tests/ -v --cov=cognilens --cov-report=xml

      - name: Run linting
        if: always()
        run: |
          ruff check src/ tests/

      - name: Run type checking
        if: always()
        run: |
          mypy src/ --ignore-missing-imports

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
